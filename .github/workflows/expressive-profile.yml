name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .profile/enhance.mjs
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: v1
          path: .ep-action
      - name: Prepare helper
        run: |
          npm --prefix /tmp/ep-deps install --no-save @material/material-color-utilities pngjs jpeg-js esbuild
          NODE_PATH=/tmp/ep-deps/node_modules /tmp/ep-deps/node_modules/.bin/esbuild .profile/enhance.mjs --bundle --platform=node --format=cjs --legal-comments=none --outfile=/tmp/enhance.cjs
      - name: Sync avatar color and shape
        run: node /tmp/enhance.cjs pre
      - name: Render expressive profile
        run: node .ep-action/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Render Maksik card
        run: node /tmp/enhance.cjs post
      - name: Commit
        run: |
          rm -rf .ep-action
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile profile.json
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
